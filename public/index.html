<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoNex Web Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .logo { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
    .search-container { width: 100%; max-width: 680px; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; background: #161b26; padding: 8px; border-radius: 12px; border: 1px solid #2d3748; }
    .search-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px 14px; font-size: 1rem; }
    .search-box button { background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; width: 100%; max-width: 680px; }
    .card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .card:hover { border-color: #8b5cf6; transform: translateY(-2px); }
    .card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .card .title { font-size: 0.9rem; font-weight: 600; }
    .badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; margin-top: 6px; font-weight: bold; background: rgba(139, 92, 246, 0.2); color: #a855f7; }

    .results-container { width: 100%; max-width: 680px; margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .video-card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .video-card:hover { border-color: #8b5cf6; transform: translateY(-3px); }
    .video-card img { width: 100%; height: 120px; object-fit: cover; }
    .video-card h3 { font-size: 0.85rem; padding: 10px; line-height: 1.3; }
    .video-card p { font-size: 0.75rem; color: #94a3b8; padding: 0 10px 10px; }

    .web-card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; text-decoration: none; color: inherit; display: block; }
    .web-card:hover { border-color: #8b5cf6; transform: translateY(-3px); }
    .web-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: #a855f7; line-height: 1.3; }
    .web-card .web-url { font-size: 0.7rem; color: #64748b; margin-bottom: 8px; word-break: break-all; }
    .web-card p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }

    .filters { width: 100%; max-width: 680px; display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
    .filter-btn { background: #161b26; border: 1px solid #2d3748; color: #94a3b8; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
    .filter-btn.active { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border-color: transparent; }
    .filter-btn:hover:not(.active) { border-color: #8b5cf6; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🟣 GoNex Bridge</div>
    <div class="subtitle">Buscador multi-motor integrado</div>
  </div>

  <div class="search-container">
    <form id="search-form" class="search-box">
      <input id="search-input" type="text" placeholder="Busca en Google, Tavily, YouTube o pega una URL..." required />
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-mode="google" onclick="setMode('google')">🔍 Google</button>
    <button class="filter-btn" data-mode="web" onclick="setMode('web')">🌐 Web</button>
    <button class="filter-btn" data-mode="youtube" onclick="setMode('youtube')">📺 YouTube</button>
  </div>

  <div class="grid">
    <div class="card" onclick="setMode('google'); handleInput('noticias de tecnología')">
      <div class="icon">🔍</div>
      <div class="title">Google</div>
      <div class="badge">BUSCADOR</div>
    </div>
    <div class="card" onclick="setMode('web'); handleInput('noticias de tecnología')">
      <div class="icon">🌐</div>
      <div class="title">Web Search</div>
      <div class="badge">TAVILY</div>
    </div>
    <div class="card" onclick="setMode('youtube'); handleInput('musica')">
      <div class="icon">📺</div>
      <div class="title">YouTube</div>
      <div class="badge">VIDEOS</div>
    </div>
    <div class="card" onclick="handleInput('https://classroom.google.com')">
      <div class="icon">🏫</div>
      <div class="title">Classroom</div>
      <div class="badge">DIRECTO</div>
    </div>
  </div>

  <div id="results-container" class="results-container"></div>

  <script>
    // ==========================================================
    // MODO ACTIVO: 'google' (por defecto), 'web' o 'youtube'
    // ==========================================================
    var currentMode = 'google';

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
    }

    // ==========================================================
    // UTILIDADES
    // ==========================================================
    function extractYouTubeId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    // ==========================================================
    // BÚSQUEDA EN YOUTUBE
    // ==========================================================
    async function searchYouTube(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="color:#94a3b8;">Buscando en YouTube...</p>';
      try {
        const response = await fetch(`/api/youtube-search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error(`Error ${response.status}`);
        const data = await response.json();
        displayYouTubeResults(data.results);
      } catch (error) {
        container.innerHTML = `<p style="color:#ef4444;">Error al buscar en YouTube: ${error.message}</p>`;
      }
    }

    function displayYouTubeResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">No se encontraron videos.</p>';
        return;
      }
      results.forEach((video) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img src="${video.thumbnail}" alt="${video.title}" loading="lazy" />
          <h3>${video.title}</h3>
          <p>${video.channelTitle}</p>
        `;
        card.addEventListener('click', () => {
          // ✅ YouTube abre en pestaña nueva
          window.open(`https://www.youtube.com/watch?v=${video.videoId}`, '_blank');
        });
        container.appendChild(card);
      });
    }

    // ==========================================================
    // BÚSQUEDA WEB (TAVILY)
    // ==========================================================
    async function searchWeb(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="color:#94a3b8;">Buscando en la web...</p>';
      try {
        const response = await fetch(`/api/web-search?q=${encodeURIComponent(query)}`);
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('El servidor no respondió con JSON.');
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Error ${response.status}`);
        displayWebResults(data.results);
      } catch (error) {
        container.innerHTML = `<p style="color:#ef4444;">Error al buscar en la web: ${error.message}</p>`;
      }
    }

    // ==========================================================
    // BÚSQUEDA EN GOOGLE (Custom Search API)
    // ==========================================================
    async function searchGoogle(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="color:#94a3b8;">Buscando en Google...</p>';
      try {
        const response = await fetch(`/api/google-search?q=${encodeURIComponent(query)}`);
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('El servidor no respondió con JSON.');
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Error ${response.status}`);
        displayWebResults(data.results);
      } catch (error) {
        container.innerHTML = `<p style="color:#ef4444;">Error al buscar en Google: ${error.message}</p>`;
      }
    }

    // ==========================================================
    // DISPLAY DE RESULTADOS WEB (Google y Tavily)
    // ==========================================================
    function displayWebResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">No se encontraron resultados.</p>';
        return;
      }
      results.forEach((item) => {
        const card = document.createElement('a');
        card.className = 'web-card';
        card.href = item.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.innerHTML = `
          <h3>${item.title}</h3>
          <div class="web-url">${item.url}</div>
          <p>${item.description}</p>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================================
    // FLUJO PRINCIPAL
    // ==========================================================
    function handleInput(input) {
      const clean = input.trim();
      const ytId = extractYouTubeId(clean);

      if (ytId) {
        // URL de YouTube → abrir en pestaña nueva
        window.open(`https://www.youtube.com/watch?v=${ytId}`, '_blank');
      } else if (clean.includes('.') && !clean.includes(' ')) {
        // URL genérica → abrir en pestaña nueva
        const url = clean.startsWith('http') ? clean : 'https://' + clean;
        window.open(url, '_blank');
      } else {
        // Texto → según el modo activo
        if (currentMode === 'youtube') {
          searchYouTube(clean);
        } else if (currentMode === 'web') {
          searchWeb(clean);
        } else {
          searchGoogle(clean);
        }
      }
    }

    document.getElementById('search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      handleInput(document.getElementById('search-input').value);
    });
  </script>
</body>
</html>
