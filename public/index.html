<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoNex Web Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .logo { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
    .search-container { width: 100%; max-width: 680px; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; background: #161b26; padding: 8px; border-radius: 12px; border: 1px solid #2d3748; }
    .search-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px 14px; font-size: 1rem; }
    .search-box button { background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; width: 100%; max-width: 680px; }
    .card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .card:hover { border-color: #8b5cf6; transform: translateY(-2px); }
    .card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .card .title { font-size: 0.9rem; font-weight: 600; }
    .badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; margin-top: 6px; font-weight: bold; background: rgba(139, 92, 246, 0.2); color: #a855f7; }
    .results-container { width: 100%; max-width: 680px; margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .video-card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .video-card:hover { border-color: #8b5cf6; transform: translateY(-3px); }
    .video-card img { width: 100%; height: 120px; object-fit: cover; }
    .video-card h3 { font-size: 0.85rem; padding: 10px; line-height: 1.3; }
    .video-card p { font-size: 0.75rem; color: #94a3b8; padding: 0 10px 10px; }
    .web-card { background: #161b26; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; color: inherit; display: block; }
    .web-card:hover { border-color: #8b5cf6; transform: translateY(-3px); }
    .web-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: #a855f7; line-height: 1.3; }
    .web-card .web-url { font-size: 0.7rem; color: #64748b; margin-bottom: 8px; word-break: break-all; }
    .web-card p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }
    .filters { width: 100%; max-width: 680px; display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
    .filter-btn { background: #161b26; border: 1px solid #2d3748; color: #94a3b8; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
    .filter-btn.active { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border-color: transparent; }
    .filter-btn:hover:not(.active) { border-color: #8b5cf6; color: #fff; }
    .secret-panel { display: none; width: 100%; max-width: 680px; margin-top: 25px; padding: 20px; background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(99, 102, 241, 0.1)); border: 2px dashed #8b5cf6; border-radius: 14px; position: relative; }
    .secret-panel.active { display: block; animation: fadeIn 0.3s ease-in; }
    .secret-panel h3 { color: #a855f7; font-size: 1rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
    .secret-close { position: absolute; top: 10px; right: 12px; background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
    .secret-close:hover { color: #ef4444; }
    .secret-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .secret-btn { background: #161b26; border: 1px solid #8b5cf6; color: #f1f5f9; padding: 14px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; text-align: center; position: relative; }
    .secret-btn:hover { background: linear-gradient(135deg, #8b5cf6, #6366f1); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }
    .secret-btn .secret-icon { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    .secret-btn .external-badge { position: absolute; top: 4px; right: 4px; font-size: 0.6rem; background: #64748b; color: #fff; padding: 2px 5px; border-radius: 4px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(6px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-close { background: #2d3748; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-close:hover { background: #ef4444; }
    .viewer-actions { display: flex; gap: 10px; align-items: center; }
    .viewer-actions a { color: #a855f7; text-decoration: none; font-size: 0.85rem; }
    .web-viewer-wrapper { width: 100%; max-width: 1000px; height: 78vh; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #2d3748; position: relative; }
    .web-viewer-wrapper iframe { width: 100%; height: 100%; border: none; }
    .web-viewer-loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: #94a3b8; gap: 15px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🟣 GoNex Bridge</div>
    <div class="subtitle">Buscador multi-motor integrado</div>
  </div>

  <div class="search-container">
    <form id="search-form" class="search-box">
      <input id="search-input" type="text" placeholder="Busca en la web, YouTube, o pega una URL..." required />
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-mode="web" onclick="setMode('web')">🌐 Web</button>
    <button class="filter-btn" data-mode="youtube" onclick="setMode('youtube')">📺 YouTube</button>
  </div>

  <div class="grid">
    <div class="card" onclick="setMode('web'); handleInput('noticias de tecnología')">
      <div class="icon">🌐</div><div class="title">Web Search</div><div class="badge">TAVILY</div>
    </div>
    <div class="card" onclick="setMode('youtube'); handleInput('musica')">
      <div class="icon">📺</div><div class="title">YouTube</div><div class="badge">VIDEOS</div>
    </div>
    <div class="card" onclick="handleInput('https://classroom.google.com')">
      <div class="icon">🏫</div><div class="title">Classroom</div><div class="badge">DIRECTO</div>
    </div>
    <div class="card" onclick="handleInput('https://www.google.com')">
      <div class="icon">🔍</div><div class="title">Google</div><div class="badge">DIRECTO</div>
    </div>
  </div>

  <div id="secret-panel" class="secret-panel">
    <button class="secret-close" onclick="hideSecretPanel()">✕</button>
    <h3>⭐ Panel Secreto GoNex</h3>
    <div id="secret-grid" class="secret-grid"></div>
  </div>

  <div id="results-container" class="results-container"></div>

  <div id="web-viewer-modal" class="modal">
    <div class="modal-header">
      <span>Visor GoNex</span>
      <div class="viewer-actions">
        <a id="viewer-open-external" href="#" target="_blank">Abrir fuera ↗</a>
        <button class="btn-close" onclick="closeModal('web-viewer-modal')">Cerrar ✕</button>
      </div>
    </div>
    <div class="web-viewer-wrapper">
      <div id="web-viewer-loading" class="web-viewer-loading">
        <p>Cargando página...</p>
        <p style="font-size: 0.75rem;">Si tarda mucho, es posible que el sitio bloquee la visualización integrada.</p>
      </div>
      <iframe id="web-viewer-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <script>
    // ==========================================================
    // 🔐 CÓDIGO SECRETO
    // ==========================================================
    const SECRET_CODE = 'gonex2026';

    const SECRET_BUTTONS = [
      {
        icon: '🐰',
        label: 'BaD BUNNY',
        url: 'https://www.canva.com/design/DAHMRaEH3qU/unar59-cooD-8Dufwnxk0w/view?embed'
      },
      {
        icon: '🎸',
        label: 'Rock Music',
        url: 'https://www.canva.com/design/DAHKHpNFubU/4bZCz-YrnpQpkPcnVN3IHw/view?embed'
      },
      {
        icon: '🎮',
        label: 'Classroom 6x',
        url: 'https://sites.google.com/view/classroom6x/',
        external: true
      },
    ];

    function buildSecretButtons() {
      const grid = document.getElementById('secret-grid');
      grid.innerHTML = '';
      SECRET_BUTTONS.forEach((btn) => {
        const el = document.createElement('button');
        el.className = 'secret-btn';
        const badge = btn.external ? '<span class="external-badge">↗</span>' : '';
        el.innerHTML = `${badge}<span class="secret-icon">${btn.icon}</span>${btn.label}`;
        el.addEventListener('click', () => {
          if (btn.external) window.open(btn.url, '_blank');
          else openWebViewer(btn.url);
        });
        grid.appendChild(el);
      });
    }

    function showSecretPanel() {
      buildSecretButtons();
      document.getElementById('secret-panel').classList.add('active');
    }
    function hideSecretPanel() {
      document.getElementById('secret-panel').classList.remove('active');
    }
    function toggleSecretPanel() {
      const panel = document.getElementById('secret-panel');
      if (panel.classList.contains('active')) hideSecretPanel();
      else showSecretPanel();
    }

    // ==========================================================
    // VISOR WEB (iframe directo, sin proxy)
    // ==========================================================
    function openWebViewer(url) {
      const iframe = document.getElementById('web-viewer-iframe');
      const loading = document.getElementById('web-viewer-loading');
      const externalLink = document.getElementById('viewer-open-external');

      document.getElementById('web-viewer-modal').classList.add('active');
      loading.style.display = 'flex';
      loading.innerHTML = '<p>Cargando página...</p><p style="font-size:0.75rem;">Si tarda mucho, es posible que el sitio bloquee la visualización integrada.</p>';
      iframe.style.display = 'none';
      externalLink.href = url;

      // ✅ Usamos la URL directamente (Canva embed funciona sin proxy)
      iframe.src = url;

      iframe.onload = function () {
        loading.style.display = 'none';
        iframe.style.display = 'block';
      };

      setTimeout(() => {
        if (iframe.style.display === 'none') {
          loading.innerHTML = `
            <p style="color: #ef4444;">El sitio está tardando en responder.</p>
            <p style="font-size: 0.8rem;">Puedes intentar con "Abrir fuera ↗"</p>
          `;
        }
      }, 8000);
    }

    // ==========================================================
    // MODO
    // ==========================================================
    var currentMode = 'web';
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
    }

    function extractYouTubeId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    async function searchYouTube(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="color:#94a3b8;">Buscando en YouTube...</p>';
      try {
        const response = await fetch(`/api/youtube-search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error(`Error ${response.status}`);
        const data = await response.json();
        displayYouTubeResults(data.results);
      } catch (error) {
        container.innerHTML = `<p style="color:#ef4444;">Error: ${error.message}</p>`;
      }
    }

    function displayYouTubeResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">No se encontraron videos.</p>';
        return;
      }
      results.forEach((video) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img src="${video.thumbnail}" alt="${video.title}" loading="lazy" />
          <h3>${video.title}</h3>
          <p>${video.channelTitle}</p>
        `;
        card.addEventListener('click', () => {
          window.open(`https://www.youtube.com/watch?v=${video.videoId}`, '_blank');
        });
        container.appendChild(card);
      });
    }

    async function searchWeb(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '<p style="color:#94a3b8;">Buscando en la web...</p>';
      try {
        const response = await fetch(`/api/web-search?q=${encodeURIComponent(query)}`);
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Respuesta no JSON.');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Error ${response.status}`);
        displayWebResults(data.results);
      } catch (error) {
        container.innerHTML = `<p style="color:#ef4444;">Error: ${error.message}</p>`;
      }
    }

    function displayWebResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">No se encontraron resultados.</p>';
        return;
      }
      results.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'web-card';
        card.innerHTML = `
          <h3>${item.title}</h3>
          <div class="web-url">${item.url}</div>
          <p>${item.description}</p>
        `;
        card.addEventListener('click', () => openWebViewer(item.url));
        container.appendChild(card);
      });
    }

    function handleInput(input) {
      const clean = input.trim();
      if (clean.toLowerCase() === SECRET_CODE.toLowerCase()) {
        toggleSecretPanel();
        return;
      }
      const ytId = extractYouTubeId(clean);
      if (ytId) {
        window.open(`https://www.youtube.com/watch?v=${ytId}`, '_blank');
      } else if (clean.includes('.') && !clean.includes(' ')) {
        const url = clean.startsWith('http') ? clean : 'https://' + clean;
        openWebViewer(url);
      } else {
        if (currentMode === 'youtube') searchYouTube(clean);
        else searchWeb(clean);
      }
    }

    function closeModal(modalId) {
      if (modalId === 'web-viewer-modal') {
        document.getElementById('web-viewer-iframe').src = 'about:blank';
      }
      document.getElementById(modalId).classList.remove('active');
    }

    document.getElementById('search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      handleInput(document.getElementById('search-input').value);
    });
  </script>
</body>
</html>
