<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Restringido</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('https://storage.googleapis.com/support-forums-api/attachment/thread-53897058-18067303099840103141.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 16px;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #e0574a;
    }
    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 20px;
    }
    .hint {
      font-size: 0.9rem;
      color: #888;
    }
    .cursor::after {
      content: '_';
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>ERROR 403</h1>
    <p>No tienes permiso para acceder a este recurso.</p>
    <p class="hint">Introduce el código de acceso...</p>
    <p class="cursor" id="status"></p>
  </div>

  <script>
    // El famoso código Konami
    const KONAMI_CODE = [
      'ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown',
      'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight',
      'b', 'a'
    ];
    let konamiIndex = 0;
    const statusEl = document.getElementById('status');

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === KONAMI_CODE[konamiIndex]) {
        konamiIndex++;
        statusEl.textContent = '[' + '*'.repeat(konamiIndex) + ']';
        if (konamiIndex === KONAMI_CODE.length) {
          // ¡Código correcto! Redirigir a la página principal
          window.location.href = '/index.html';
        }
      } else {
        // Si la tecla es incorrecta, reinicia el contador
        konamiIndex = 0;
        statusEl.textContent = '';
      }
    });
  </script>
</body>
</html>
