<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error 403</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      user-select: none;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <img
    src="https://storage.googleapis.com/support-forums-api/attachment/thread-53897058-18067303099840103141.jpg"
    alt="Error 403"
    draggable="false"
  />

  <script>
    // Código Konami silencioso: ↑ ↑ ↓ ↓ ← → ← → B A
    const KONAMI_CODE = [
      'arrowup', 'arrowup', 'arrowdown', 'arrowdown',
      'arrowleft', 'arrowright', 'arrowleft', 'arrowright',
      'b', 'a'
    ];
    let konamiIndex = 0;

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      // Evitar que las flechas hagan scroll
      if (key.startsWith('arrow')) e.preventDefault();

      if (key === KONAMI_CODE[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === KONAMI_CODE.length) {
          // Código completo → redirigir a GoNex
          window.location.href = '/index.html';
        }
      } else {
        // Si se equivoca, reiniciar (pero permitir reintentar con la primera tecla)
        konamiIndex = (key === KONAMI_CODE[0]) ? 1 : 0;
      }
    });
  </script>
</body>
</html>
