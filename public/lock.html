<script>
  // El código Konami - acepta mayúsculas y minúsculas
  const KONAMI_CODE = [
    'arrowup', 'arrowup', 'arrowdown', 'arrowdown',
    'arrowleft', 'arrowright', 'arrowleft', 'arrowright',
    'b', 'a'
  ];
  let konamiIndex = 0;
  const statusEl = document.getElementById('status');

  document.addEventListener('keydown', (e) => {
    // Normalizar la tecla a minúscula
    const key = e.key.toLowerCase();
    
    // Prevenir scroll de flechas
    if (key.startsWith('arrow')) {
      e.preventDefault();
    }
    
    if (key === KONAMI_CODE[konamiIndex]) {
      konamiIndex++;
      statusEl.textContent = '[' + '★'.repeat(konamiIndex) + '☆'.repeat(KONAMI_CODE.length - konamiIndex) + ']';
      
      if (konamiIndex === KONAMI_CODE.length) {
        // ¡Código correcto! Redirigir a la página principal
        statusEl.textContent = '[ACCESO CONCEDIDO]';
        statusEl.style.color = '#7fb069';
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 300);
      }
    } else {
      // Si la tecla es incorrecta, reinicia (pero permite repetir la primera tecla)
      if (key === KONAMI_CODE[0]) {
        konamiIndex = 1;
        statusEl.textContent = '[' + '★'.repeat(1) + '☆'.repeat(KONAMI_CODE.length - 1) + ']';
      } else {
        konamiIndex = 0;
        statusEl.textContent = '';
      }
    }
  });
</script>
